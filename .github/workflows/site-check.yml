# Navain AI — static site health check.
#
# Runs zero-dependency static site, accessibility, and performance checks on
# every push and pull request. They validate markup/links/SEO, common accessible
# names and contrast tokens, and the shipped asset budgets. These are useful CI
# smoke tests; they do not replace browser-based accessibility or Core Web
# Vitals testing. Python's stdlib only — no install step.

name: site-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  site-check:
    name: Validate site, accessibility & asset budgets
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check HTML, links, SEO and JSON-LD
        run: python3 tools/check-site.py

      - name: Check accessibility fundamentals and contrast tokens
        run: python3 tools/check-a11y.py

      - name: Check static performance budgets
        run: python3 tools/check-performance.py
